<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMAFORO - Arduino UNO</title>
<style>
  :root{ --body-yellow:#dccc3a; --green:#65cb6f; --yellow:#cbc165; --red:#df4040; }
  *{box-sizing:border-box; font-family:Arial,Helvetica,sans-serif;}
  body{margin:0; background:#ffffff; display:flex; min-height:100vh; align-items:center; justify-content:center;}
  .wrap{display:flex; gap:24px; align-items:flex-start; background:#fff; padding:24px;}
  .left-panel{background:var(--body-yellow); border-radius:24px; padding:18px 22px; width:281px;}
  .status-box{background:#000; color:#fff; border-radius:60px; text-align:center; font-weight:800; letter-spacing:2px; padding:14px; font-size:28px;}
  .info{margin-top:14px; background:#fff; border-radius:16px; padding:12px 14px; border:1px solid #eee;}
  .info h2{margin:0 0 6px 0; font-size:18px;}
  .big{font-size:56px; font-weight:900; margin:0; line-height:1;}
  .row{font-size:15px; margin:4px 0;}
  .pill{display:inline-block; padding:2px 10px; border-radius:999px; background:#000; color:#fff; font-size:12px;}
  .semaforo{background:var(--body-yellow); border-radius:88px; width:233px; padding:28px 0; display:flex; flex-direction:column; gap:24px; align-items:center;}
  .foco{width:159px; height:159px; border-radius:50%; border:4px solid #000; opacity:.22; transition:opacity .2s, box-shadow .2s;}
  .foco.verde{background:var(--green);} .foco.amarillo{background:var(--yellow);} .foco.rojo{background:var(--red);}
  .foco.on{opacity:1; box-shadow:0 0 40px 8px rgba(255,255,255,.9), 0 0 18px 4px currentColor;}
  .foot{font-size:12px; color:#333; margin-top:10px;}
  code{background:#eee; padding:1px 6px; border-radius:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="left-panel">
    <div class="status-box" id="statusLabel">STATUS</div>
    <div class="info">
      <h2>Arduino UNO <span class="pill" id="src">...</span></h2>
      <p class="big"><span id="count">--</span><span style="font-size:20px"> s</span></p>
      <p class="row">Luz activa: <b id="light">--</b></p>
      <p class="row">Puerto activo: <b id="pin">--</b></p>
      <p class="row">Puerto serial: <b id="port">--</b></p>
      <p class="row" style="color:#555">Rojo PIN 2 (20s) - Amarillo PIN 3 (5s) - Verde PIN 4 (25s)</p>
      <p class="foot">Lee de <code>/api/status</code> cada 500ms.</p>
    </div>
  </div>
  <div class="semaforo">
    <div class="foco verde" id="fGREEN"></div>
    <div class="foco amarillo" id="fYELLOW"></div>
    <div class="foco rojo" id="fRED"></div>
  </div>
</div>
<script>
async function tick(){
  try{
    const r = await fetch('/api/status');
    const s = await r.json();
    document.getElementById('count').textContent = s.remaining;
    document.getElementById('light').textContent = s.light;
    document.getElementById('pin').textContent = 'PIN ' + s.pin;
    document.getElementById('port').textContent = s.port || 'simulacion';
    document.getElementById('src').textContent = s.source;
    document.getElementById('statusLabel').textContent = s.light + ' ' + s.remaining + 's';
    for (const c of ['RED','YELLOW','GREEN']){
      document.getElementById('f'+c).classList.toggle('on', s.light===c);
    }
  }catch(e){}
}
setInterval(tick, 500); tick();
</script>
</body>
</html>
